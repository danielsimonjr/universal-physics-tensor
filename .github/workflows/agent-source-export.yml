name: Agent source export

on:
  push:
    branches:
      - agent/complete-universal-physics-tensor
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive the complete working tree
        run: tar --exclude=.git -czf /tmp/universal-physics-tensor-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: universal-physics-tensor-source
          path: /tmp/universal-physics-tensor-source.tgz
          retention-days: 1

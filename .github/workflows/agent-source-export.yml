name: Agent dependency lock export

on:
  push:
    branches:
      - agent/complete-universal-physics-tensor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Pin the TypeScript runner used by repository tools
        run: npm install --save-dev --save-exact tsx@4.23.1 --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-tsx-lockfiles
          path: |
            package.json
            package-lock.json
          retention-days: 1

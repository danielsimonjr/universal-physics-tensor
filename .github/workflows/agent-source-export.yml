name: Agent source export

on:
  push:
    branches:
      - agent/complete-universal-physics-tensor
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive the complete audit workspace
        run: tar --exclude=.git -czf /tmp/universal-physics-tensor-audit-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: universal-physics-tensor-audit-workspace
          path: /tmp/universal-physics-tensor-audit-workspace.tgz
          retention-days: 1

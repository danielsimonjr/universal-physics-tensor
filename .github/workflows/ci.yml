name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          UPT_REQUIRE_PEERS: '1'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:plans
      - run: npm run package:check
      - run: npm audit --audit-level=high

  docs-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:deps
      - name: Fail when committed architecture docs are stale
        run: |
          if ! git diff --quiet -- docs/architecture/; then
            echo "::error::docs/architecture/ is stale -- run 'npm run docs:deps' and commit the result."
            git diff --stat -- docs/architecture/
            exit 1
          fi
          echo "docs/architecture/ matches a fresh generation."

  long-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          UPT_REQUIRE_PEERS: '1'
          GL4_LONG: '1'

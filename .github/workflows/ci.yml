name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # v0.10.0 T1: the strict whole-repo gate (tests/ + bench/ are
      # excluded from the base tsconfig; baseline is empty — zero
      # tolerance).
      - run: npx tsc -p tsconfig.tests.json
      # UPT_REQUIRE_PEERS makes the optional MathTS autograd peer mandatory in
      # CI: the AST-AD tests gate on peer presence via it.runIf, so without this
      # a failed optional-install would silently skip them behind a green check.
      - run: npx vitest run
        env:
          UPT_REQUIRE_PEERS: '1'

name: Apply UPT completion patch

on:
  push:
    branches:
      - agent/upt-completion-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
